<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AXIOM SWARM AI // HACK THE HIVE</title>
    <style>
        body { margin: 0; background-color: #020104; color: #ff00ff; font-family: monospace; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; user-select: none; }
        #container { position: relative; border: 2px solid #ff00ff; }
        .hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85); border: 1px solid #ff00ff; padding: 12px; font-size: 13px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="container">
        <div class="hud">
            <span style="color:#00ffff; font-weight:bold;">OBJETIVO: INFECTA LA COLMENA (TÓCALOS)</span><br>
            AGENTES INFECTADOS: <span id="infected">0</span> / <span id="total">0</span><br>
            PUNTOS DE HACKEO: <span id="score">0</span>
        </div>
        <canvas id="canvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth < 800 ? window.innerWidth - 20 : 800;
        canvas.height = window.innerHeight < 600 ? window.innerHeight - 20 : 600;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playInfectSound() {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        const boids = []; const numBoids = 350;
        let score = 0, infectedCount = 0;
        document.getElementById('total').innerText = numBoids;

        for(let i=0; i<numBoids; i++) {
            boids.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                infected: false
            });
        }

        let input = { x: -1000, y: -1000 };
        function updateInput(ex, ey) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            input.x = ex; input.y = ey;
        }
        canvas.addEventListener('mousemove', (e) => { const r = canvas.getBoundingClientRect(); updateInput(e.clientX - r.left, e.clientY - r.top); });
        canvas.addEventListener('touchmove', (e) => { const r = canvas.getBoundingClientRect(); const t = e.touches[0]; updateInput(t.clientX - r.left, t.clientY - r.top); e.preventDefault(); }, {passive: false});

        function loop() {
            ctx.fillStyle = 'rgba(2, 1, 5, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            infectedCount = 0;

            boids.forEach(boid => {
                let closeDx = 0, closeDy = 0, xVelAvg = 0, yVelAvg = 0, neighbors = 0;

                // Lógica de enjambre + Contagio
                boids.forEach(other => {
                    let dx = boid.x - other.x, dy = boid.y - other.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 30 && dist > 0) {
                        if(dist < 8) { closeDx += dx; closeDy += dy; }
                        xVelAvg += other.vx; yVelAvg += other.vy; neighbors++;
                        // Si un boid infectado toca a otro, hay probabilidad de contagio grupal
                        if(other.infected && Math.random() < 0.005) boid.infected = true;
                    }
                });

                // Interacción con el jugador
                let idx = boid.x - input.x, idy = boid.y - input.y;
                if(Math.sqrt(idx*idx + idy*idy) < 35 && !boid.infected) {
                    boid.infected = true;
                    playInfectSound();
                }

                if(neighbors > 0) {
                    xVelAvg /= neighbors; yVelAvg /= neighbors;
                    boid.vx += (xVelAvg - boid.vx) * 0.05; boid.vy += (yVelAvg - boid.vy) * 0.05;
                }
                boid.vx += closeDx * 0.15; boid.vy += closeDy * 0.15;
                
                // WOW MOMENT: Si la mitad está infectada, entran en órbita loca
                let force = infectedCount > numBoids/2 ? 0.002 : 0.0003;
                boid.vx += (canvas.width/2 - boid.x) * force; boid.vy += (canvas.height/2 - boid.y) * force;

                let speed = Math.sqrt(boid.vx*boid.vx + boid.vy*boid.vy);
                let maxSpeed = boid.infected ? 6 : 3.5;
                if(speed > maxSpeed) { boid.vx = (boid.vx/speed)*maxSpeed; boid.vy = (boid.vy/speed)*maxSpeed; }

                boid.x += boid.vx; boid.y += boid.vy;
                if(boid.x < 0) boid.x = canvas.width; if(boid.x > canvas.width) boid.x = 0;
                if(boid.y < 0) boid.y = canvas.height; if(boid.y > canvas.height) boid.y = 0;

                if(boid.infected) { infectedCount++; ctx.fillStyle = '#ff00ff'; }
                else { ctx.fillStyle = '#00ffff'; }

                ctx.beginPath(); ctx.arc(boid.x, boid.y, boid.infected ? 2.5 : 2, 0, Math.PI*2); ctx.fill();
            });

            if(infectedCount > 0) score += Math.floor(infectedCount / 10);
            document.getElementById('infected').innerText = infectedCount;
            document.getElementById('score').innerText = score;

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
